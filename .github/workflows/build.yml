name: Build APK Fem-Zap
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Gerar projeto Android
        run: |
          flutter create --platforms=android --org com.femzap --project-name femzap .
          cp app/main.dart lib/main.dart
          cp app/pubspec.yaml pubspec.yaml
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/><uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30"/><uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/><uses-permission android:name="android.permission.CHANGE_WIFI_STATE"/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE"/><uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/><uses-permission android:name="android.permission.BLUETOOTH_SCAN"/><uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES"/><uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/><uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/><application#' $M
          sed -i 's#android:label="[^"]*"#android:label="Fem-Zap"#' $M
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 26/' android/app/build.gradle* || true
      - run: flutter pub get
      - name: Ajustar compileSdk dos plugins
        run: |
          find $HOME/.pub-cache/hosted/pub.dev -path '*/android/build.gradle' -exec sed -i -E 's/(compileSdk(Version)?[ =]+)(2[0-9]|3[0-5])/\136/' {} +
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Fem-Zap-APK
          path: build/app/outputs/flutter-apk/app-release.apk
